<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сводка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E6E2; --card:#F6F5F2; --ink:#151515; --muted:#5E5B57; --line:#B9B4AD;
  --dark:#151515; --dark2:#2A2826; --on-dark:#F3F1ED; --on-dark-muted:#B8B2AA;
  --photo:#3B342D; --accent-ru:#8A4B2A; --accent-idea:#2F5A7A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 120px}
.hidden{display:none!important}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.date{font-size:13px;font-weight:500;color:var(--muted)}
.h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.round{width:46px;height:46px;border-radius:23px;border:none;background:var(--dark);display:flex;align-items:center;justify-content:center}

/* главная карточка */
.hero{position:relative;display:block;width:100%;height:380px;border:none;padding:0;text-align:left;border-radius:32px;overflow:hidden;background:var(--photo);box-shadow:0 18px 40px rgba(20,18,16,.18)}
.hero img,.thumb img,.cover img{width:100%;height:100%;object-fit:cover;display:block}
.hero .shade{position:absolute;inset:auto 0 0 0;height:250px;background:linear-gradient(to top,rgba(14,13,12,.94),rgba(14,13,12,0))}
.hero .body{position:absolute;left:22px;right:22px;bottom:22px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px}
.pill.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff}
.pill.light{background:var(--on-dark);color:var(--ink);font-weight:700}
.hero .title{font-size:25px;line-height:1.14;font-weight:800;color:#fff;letter-spacing:-.01em}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .meta{font-size:13px;color:#CFC8BF}
.btn-light{background:var(--on-dark);color:var(--ink);font-size:14px;font-weight:700;padding:11px 20px;border-radius:999px;flex-shrink:0}

.intro{margin:14px 4px 0;font-size:15px;line-height:1.45;color:#3F3C38}

/* рубрики */
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;background:transparent;border:1px solid var(--line)}
.chip.on{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}

/* цифры */
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.fig{background:var(--card);border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fig:last-child{background:var(--dark);color:var(--on-dark)}
.fig .l{font-size:11px;font-weight:600;color:var(--muted)}
.fig:last-child .l,.fig:last-child .n{color:var(--on-dark-muted)}
.fig .v{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.fig .n{font-size:11px;font-weight:600;color:var(--muted);line-height:1.3}

/* список */
.sect{font-size:18px;font-weight:800;margin:20px 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:26px;padding:10px;display:flex;gap:12px;align-items:center;border:none;width:100%;text-align:left}
.thumb{width:84px;height:84px;border-radius:20px;background:#CFC9C1;flex-shrink:0;overflow:hidden}
.kicker{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.kicker.r-Россия{color:var(--accent-ru)} .kicker.r-Идеи{color:var(--accent-idea)}
.item .t{font-size:15px;line-height:1.25;font-weight:700;margin-top:4px}
.empty{background:var(--card);border-radius:26px;padding:24px;text-align:center;color:var(--muted);font-size:15px}

/* нижнее меню */
.dock{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);border-radius:999px;padding:7px;display:flex;gap:6px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:5}
.dock button{width:48px;height:48px;border-radius:24px;border:none;background:var(--dark2);display:flex;align-items:center;justify-content:center}
.dock button.on{background:var(--on-dark)}
.dock button svg{stroke:#D9D4CC}
.dock button.on svg{stroke:var(--ink)}

/* статья */
.cover{position:relative;height:330px;background:var(--photo);border-radius:0 0 36px 36px;overflow:hidden;margin:-20px -16px 0}
.cover .shade{position:absolute;inset:auto 0 0 0;height:200px;background:linear-gradient(to top,rgba(14,13,12,.92),rgba(14,13,12,0))}
.cover .back{position:absolute;left:18px;top:18px;width:44px;height:44px;border-radius:22px;border:none;background:rgba(20,18,16,.55);display:flex;align-items:center;justify-content:center}
.cover .body{position:absolute;left:22px;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cover .title{font-size:24px;line-height:1.15;font-weight:800;color:#fff}
.meta-row{display:flex;justify-content:space-between;margin:18px 4px 14px;font-size:13px;color:var(--muted);font-weight:600}
.box{background:var(--card);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.box.dark{background:var(--dark);color:var(--on-dark)}
.cap{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.box.dark .cap{color:#D9D4CC}
.bul{display:flex;gap:10px;font-size:15px;line-height:1.4}
.bul i{width:6px;height:6px;border-radius:3px;background:var(--ink);margin-top:8px;flex-shrink:0}
.src{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #DDDAD5;font-size:14px;font-weight:700;background:none;border-left:none;border-right:none;border-bottom:none;width:100%;text-align:left}
.src:first-of-type{border-top:none}
.actions{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;display:flex;gap:10px;z-index:5}
.actions button{flex:1;height:54px;border-radius:999px;font-size:15px;font-weight:700;border:1.5px solid var(--dark)}
.actions .ghost{background:var(--card)}
.actions .ghost.on,.actions .solid{background:var(--dark);color:var(--on-dark)}
</style>
</head>
<body>
<main class="wrap">
  <section id="feed">
    <div class="top">
      <div>
        <div class="date" id="date">Загрузка…</div>
        <div class="h1" id="heading">Сводка</div>
      </div>
      <button class="round" id="refresh" aria-label="Обновить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F1ED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
    <div id="hero"></div>
    <p class="intro hidden" id="intro"></p>
    <div class="chips" id="chips" role="tablist" aria-label="Рубрики"></div>
    <div class="figs hidden" id="figs"></div>
    <div class="sect" id="sect">Ещё сегодня</div>
    <div class="list" id="list"></div>
  </section>

  <section id="article" class="hidden"></section>
</main>

<nav class="dock" id="dock">
  <button class="on" data-tab="all" aria-label="Лента">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
  </button>
  <button data-tab="saved" aria-label="Сохранённые">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"/></svg>
  </button>
</nav>

<div class="actions hidden" id="actions">
  <button class="ghost" id="saveBtn">Сохранить</button>
  <button class="solid" id="srcBtn">Открыть источник</button>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#E8E6E2'); tg.setBackgroundColor('#E8E6E2'); } catch (e) {} }

  var RUBRICS = ['Все', 'Бизнес', 'Россия', 'Мир', 'Идеи'];
  var state = { data: null, rubric: 'Все', tab: 'all', saved: loadSaved(), current: null };
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function loadSaved() { try { return JSON.parse(localStorage.getItem('svodka_saved') || '[]'); } catch (e) { return []; } }
  function persist() { try { localStorage.setItem('svodka_saved', JSON.stringify(state.saved)); } catch (e) {} }
  function keyOf(it) { return (it.sources && it.sources[0] && it.sources[0].url) || it.title; }
  function isSaved(it) { var k = keyOf(it); return state.saved.some(function (s) { return keyOf(s) === k; }); }
  function img(it) { return it.image ? '<img src="' + esc(it.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : ''; }
  function time(it) {
    if (!it.published) return '';
    var d = new Date(it.published);
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Novosibirsk' });
  }
  function open(url) { if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank', 'noopener'); }
  function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} }

  function load() {
    fetch('data/digest.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
      state.data = d; render();
    }).catch(function () {
      $('date').textContent = 'Не удалось загрузить сводку';
      $('list').innerHTML = '<div class="empty">Проверьте интернет и нажмите «Обновить».</div>';
    });
  }

  function itemsNow() {
    if (state.tab === 'saved') return state.saved;
    var all = (state.data && state.data.items) || [];
    return state.rubric === 'Все' ? all : all.filter(function (i) { return i.rubric === state.rubric; });
  }

  function render() {
    var d = state.data; if (!d) return;
    var saved = state.tab === 'saved';
    $('date').textContent = saved ? 'Ваша подборка' : d.date_label + ' · ' + d.edition.toLowerCase();
    $('heading').textContent = saved ? 'Сохранённое' : 'Сводка';
    $('chips').classList.toggle('hidden', saved);
    $('chips').innerHTML = RUBRICS.map(function (r) {
      return '<button class="chip' + (r === state.rubric ? ' on' : '') + '" role="tab" aria-selected="' + (r === state.rubric) + '" data-r="' + r + '">' + r + '</button>';
    }).join('');

    var intro = $('intro');
    intro.textContent = d.intro || '';
    intro.classList.toggle('hidden', saved || !d.intro || state.rubric !== 'Все');

    var figs = d.key_figures || [];
    $('figs').classList.toggle('hidden', saved || !figs.length || state.rubric !== 'Все');
    $('figs').innerHTML = figs.map(function (f) {
      return '<div class="fig"><div class="l">' + esc(f.label) + '</div><div class="v">' + esc(f.value) + '</div><div class="n">' + esc(f.note || '') + '</div></div>';
    }).join('');

    var list = itemsNow();
    var hero = !saved && list[0];
    $('hero').innerHTML = hero ? (
      '<button class="hero" data-i="0">' + img(hero) + '<div class="shade"></div><div class="body">' +
      '<div><span class="pill glass">' + esc(hero.rubric) + '</span> <span class="pill light">Главное</span></div>' +
      '<div class="title">' + esc(hero.title) + '</div>' +
      '<div class="row"><div class="meta">' + esc(hero.sources[0].name) + (time(hero) ? ' · ' + time(hero) : '') + '</div><span class="btn-light">Читать</span></div>' +
      '</div></button>') : '';

    var rest = saved ? list : list.slice(1);
    $('sect').textContent = saved ? '' : 'Ещё сегодня';
    $('sect').classList.toggle('hidden', saved || !rest.length);
    $('list').innerHTML = rest.length ? rest.map(function (it, i) {
      return '<button class="item" data-i="' + (saved ? i : i + 1) + '"><div class="thumb">' + img(it) + '</div><div style="min-width:0">' +
        '<div class="kicker r-' + esc(it.rubric) + '">' + esc(it.rubric) + ' · ' + esc(it.sources[0].name) + '</div>' +
        '<div class="t">' + esc(it.title) + '</div></div></button>';
    }).join('') : (saved ? '<div class="empty">Здесь появятся новости, которые вы сохраните.</div>' : '');
  }

  function showArticle(it) {
    state.current = it;
    var bullets = (it.bullets || []).map(function (b) { return '<div class="bul"><i></i><div>' + esc(b) + '</div></div>'; }).join('');
    var sources = it.sources.map(function (s, i) {
      return '<button class="src" data-src="' + i + '"><span>' + esc(s.name) + '</span><span aria-hidden="true">↗</span></button>';
    }).join('');
    $('article').innerHTML =
      '<div class="cover">' + img(it) + '<div class="shade"></div>' +
      '<button class="back" id="back" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>' +
      '<div class="body"><span class="pill glass">' + esc(it.rubric) + '</span><div class="title">' + esc(it.title) + '</div></div></div>' +
      '<div class="meta-row"><span>' + esc(time(it) || '') + '</span><span>' + it.sources.length + ' ' + (it.sources.length === 1 ? 'источник' : 'источника') + '</span></div>' +
      (bullets ? '<div class="box"><div class="cap">ГЛАВНОЕ ЗА 30 СЕКУНД</div>' + bullets + '</div>' : '') +
      (it.impact ? '<div class="box dark"><div class="cap">ЧТО ЭТО ЗНАЧИТ ДЛЯ БИЗНЕСА</div><div style="font-size:15px;line-height:1.45">' + esc(it.impact) + '</div></div>' : '') +
      (it.sources.length > 1 ? '<div class="box"><div class="cap">ИСТОЧНИКИ</div>' + sources + '</div>' : '');
    $('feed').classList.add('hidden'); $('dock').classList.add('hidden');
    $('article').classList.remove('hidden'); $('actions').classList.remove('hidden');
    syncSave(); window.scrollTo(0, 0);
    if (tg && tg.BackButton) { tg.BackButton.show(); }
  }

  function closeArticle() {
    state.current = null;
    $('article').classList.add('hidden'); $('actions').classList.add('hidden');
    $('feed').classList.remove('hidden'); $('dock').classList.remove('hidden');
    if (tg && tg.BackButton) tg.BackButton.hide();
    render();
  }

  function syncSave() {
    var on = state.current && isSaved(state.current);
    $('saveBtn').textContent = on ? 'Сохранено' : 'Сохранить';
    $('saveBtn').classList.toggle('on', !!on);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-i],[data-r],[data-tab],[data-src],#back,#refresh,#saveBtn,#srcBtn');
    if (!t) return;
    if (t.dataset.r) { state.rubric = t.dataset.r; haptic(); render(); }
    else if (t.dataset.tab) {
      state.tab = t.dataset.tab; haptic();
      document.querySelectorAll('.dock button').forEach(function (b) { b.classList.toggle('on', b === t); });
      render(); window.scrollTo(0, 0);
    }
    else if (t.dataset.i != null) { showArticle(itemsNow()[+t.dataset.i]); }
    else if (t.dataset.src != null) { open(state.current.sources[+t.dataset.src].url); }
    else if (t.id === 'back') closeArticle();
    else if (t.id === 'refresh') load();
    else if (t.id === 'srcBtn') open(state.current.sources[0].url);
    else if (t.id === 'saveBtn') {
      var k = keyOf(state.current);
      if (isSaved(state.current)) state.saved = state.saved.filter(function (s) { return keyOf(s) !== k; });
      else state.saved.unshift(state.current);
      persist(); syncSave(); haptic();
    }
  });
  if (tg && tg.BackButton) tg.BackButton.onClick(closeArticle);

  load();
})();
</script>
</body>
</html>
